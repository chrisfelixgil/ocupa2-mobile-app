name: ocupa2
description: Cliente Android de la plataforma de empleos temporales Ocupa2.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  go_router: ^17.3.0
  provider: ^6.1.5+1
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  geocoding: ^4.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/team/
    - assets/images/home/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
